name: Publish La Tettoia

on:
  push:
    branches:
      - codex/booking-manager
    paths:
      - la-tettoia/**
      - .github/workflows/la-tettoia-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: la-tettoia-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out La Tettoia branch
        uses: actions/checkout@v4
      - name: Rebuild menu PDFs from the published menu
        # Keeps speisekarte.pdf / menu-en.pdf in sync with menu edits made in manager.html.
        # If this step fails, the PDFs committed in the repository are published instead.
        continue-on-error: true
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node la-tettoia/tools/build-menu-pdf.cjs
      - name: Prepare site files
        run: |
          mkdir -p _site/css _site/js
          cp la-tettoia/*.html _site/
          cp la-tettoia/*.pdf _site/
          cp la-tettoia/css/*.css _site/css/
          cp la-tettoia/js/*.js _site/js/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
