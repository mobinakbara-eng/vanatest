<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="AoraAI Workforce – interaktiver Frontend-Prototyp.">
<title>AoraAI Workforce</title>
<style>html,body,#root{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#ededed}.host-loader{min-height:100vh;display:grid;place-content:center;gap:14px;text-align:center;color:#111}.host-loader i{width:34px;height:34px;margin:auto;border:3px solid #ccc;border-top-color:#000;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.host-error{max-width:520px;padding:24px;line-height:1.5}</style>
</head>
<body><div id="root"><div class="host-loader"><i></i><strong>AoraAI Workforce wird geladen …</strong></div></div>
<script>
const decodeGzip=async source=>{const urls=Array.isArray(source)?source:[source];const text=(await Promise.all(urls.map(url=>fetch(url,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.text()})))).join("");const raw=atob(text.trim());const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));return new Response(stream).text()};
(async()=>{try{const [css,js]=await Promise.all([decodeGzip("./app.css.gz.b64"),decodeGzip(["./app.js.gz.b64.part1","./app.js.gz.b64.part2","./app.js.gz.b64.part3","./app.js.gz.b64.part4"])]);const style=document.createElement("style");style.textContent=css;document.head.appendChild(style);const url=URL.createObjectURL(new Blob([js],{type:"text/javascript"}));await import(url)}catch(error){console.error(error);document.getElementById("root").innerHTML=`<div class="host-loader host-error"><strong>Die Anwendung konnte nicht geladen werden.</strong><span>${String(error.message||error)}</span><button onclick="location.reload()">Erneut laden</button></div>`}})();
</script></body></html>
