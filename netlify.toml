# Netlify (temporary hosting). Headers live in _headers so Cloudflare Pages can use the same file.
[build]
  publish = "public"
  command = ""

# The site now lives on vana-management.com (Cloudflare). Send everything there.
[[redirects]]
  from = "/*"
  to = "https://vana-management.com/:splat"
  status = 301
  force = true
